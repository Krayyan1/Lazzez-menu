<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7a1414" />
<title>Lazzez Chinese Corner — Menu</title>
<meta name="description" content="Digital menu for Lazzez Chinese Corner — rice dishes, noodles, soups and specials with half and full portion pricing." />
<style>
  :root{
    --red: #8f1f1f;
    --red-deep: #5c1010;
    --gold: #c99a3d;
    --gold-soft: #e8cd8f;
    --cream: #f6ecd8;
    --cream-card: #fffbf0;
    --ink: #2a1e14;
    --ink-soft: #6b5a45;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --max-w: 640px;
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img, svg{ display:block; max-width:100%; }
  a{ color: inherit; }

  :focus-visible{
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference){
    body{ animation: page-in .5s ease both; }
  }
  @keyframes page-in{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- Header ---------- */
  header.site-header{
    background: radial-gradient(120% 140% at 50% -20%, var(--red) 0%, var(--red-deep) 70%);
    color: var(--cream);
    padding: 2.6rem 1.25rem 2rem;
    text-align:center;
    border-bottom: 4px solid var(--gold);
    position: relative;
  }
  header.site-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-8px; height:4px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px);
    opacity:.7;
  }
  .header-icon{ width:42px; height:42px; margin: 0 auto 0.75rem; color: var(--gold-soft); }
  .site-header h1{
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    margin: 0 0 .4rem;
    letter-spacing: .01em;
  }
  .site-header p.tagline{
    margin:0;
    font-size: clamp(.85rem, 2.6vw, 1rem);
    color: var(--gold-soft);
    font-style: italic;
  }

  /* ---------- Sticky category nav ---------- */
  nav.category-nav{
    position: sticky;
    top:0;
    z-index: 10;
    display:flex;
    gap:.5rem;
    overflow-x:auto;
    padding: .65rem .9rem;
    background: var(--cream);
    border-bottom: 1px solid rgba(143,31,31,.18);
    box-shadow: 0 2px 8px rgba(42,30,20,.08);
    scrollbar-width:none;
  }
  nav.category-nav::-webkit-scrollbar{ display:none; }
  nav.category-nav button{
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: .85rem;
    font-weight:600;
    color: var(--red-deep);
    background: var(--cream-card);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: .45rem 1rem;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  nav.category-nav button:hover,
  nav.category-nav button.active{
    background: var(--red);
    color: var(--cream);
    border-color: var(--red);
  }

  /* ---------- Menu ---------- */
  main{
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 1.5rem 1.1rem 1rem;
  }
  section.menu-section{ margin-bottom: 2.1rem; scroll-margin-top: 4.2rem; }
  section.menu-section h2{
    display:flex;
    align-items:center;
    gap:.45rem;
    font-family: var(--serif);
    font-size: 1.25rem;
    color: var(--red-deep);
    margin: 0 0 .2rem;
    padding-bottom:.4rem;
    border-bottom: 2px solid var(--gold);
  }
  section.menu-section h2 .cat-icon{
    font-size: 1.15rem;
    line-height:1;
  }
  .menu-row{
    display:flex;
    align-items: baseline;
    gap:.5rem;
    padding: .8rem .6rem;
    margin: 0 -.6rem;
    border-radius: 8px;
    border-bottom: 1px dashed rgba(42,30,20,.18);
    transition: background-color .15s ease;
  }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row:hover,
  .menu-row:active{
    background-color: rgba(199,154,61,.12);
  }
  .menu-row .name-wrap{ flex: 0 1 auto; }
  .menu-row .name{ font-weight:700; font-size:.98rem; }
  .menu-row .note{
    display:block;
    font-size: .78rem;
    color: var(--ink-soft);
    font-style: italic;
    margin-top:.1rem;
  }
  .menu-row .leader{
    flex: 1 1 auto;
    min-width: 10px;
    border-bottom: 2px dotted rgba(42,30,20,.28);
    transform: translateY(-5px);
  }
  .menu-row .prices{
    flex: 0 0 auto;
    display:flex;
    gap:.4rem;
    white-space: nowrap;
  }
  .price{
    font-size: .78rem;
    font-weight:700;
    padding: .18rem .55rem;
    border-radius: 5px;
    background: var(--gold-soft);
    color: var(--red-deep);
  }
  .price.full{
    background: var(--red);
    color: var(--cream);
  }

  /* ---------- Rating section ---------- */
  section.rating-section{
    max-width: var(--max-w);
    margin: 0 auto 2rem;
    padding: 0 1.1rem;
  }
  .rating-card{
    background: var(--cream-card);
    border: 2px dashed var(--gold);
    border-radius: 10px;
    padding: 1.4rem 1.2rem;
    text-align:center;
  }
  .rating-card h2{
    font-family: var(--serif);
    color: var(--red-deep);
    margin: 0 0 .3rem;
    font-size: 1.1rem;
  }
  .rating-card p{ margin: 0 0 1rem; color: var(--ink-soft); font-size: .9rem; }
  .rating-emojis{
    display:flex;
    justify-content:center;
    gap:.4rem;
    flex-wrap: wrap;
  }
  .rating-emojis button{
    font-size: 1.7rem;
    line-height:1;
    background: var(--cream);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: .5rem .6rem;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .rating-emojis button:hover,
  .rating-emojis button:focus-visible{
    background: var(--gold-soft);
  }
  .rating-emojis button.selected{
    background: var(--red);
    border-color: var(--red);
    transform: scale(1.12);
  }
  .rating-thanks{
    margin-top: .9rem;
    font-size: .88rem;
    color: var(--red-deep);
    font-weight:600;
    display:none;
  }
  .rating-thanks.show{ display:block; }

  /* ---------- Footer ---------- */
  footer{
    background: var(--ink);
    color: var(--gold-soft);
    text-align:center;
    padding: 1.4rem 1rem;
    font-size: .78rem;
  }
  footer p{ margin:.2rem 0; }

  /* ---------- Tablet / desktop ---------- */
  @media (min-width: 700px){
    :root{ --max-w: 760px; }
    header.site-header{ padding: 3.4rem 1.5rem 2.6rem; }
    nav.category-nav{ justify-content:center; flex-wrap: wrap; overflow: visible; position: static; }
    main{ padding-top: 2rem; }
    .menu-row .name{ font-size: 1.02rem; }
  }

  @media print{
    nav.category-nav, section.rating-section{ display:none; }
    header.site-header{ background: none; color: var(--ink); border-bottom: 2px solid var(--ink); }
    .site-header p.tagline{ color: var(--ink-soft); }
  }
</style>
</head>
<body>

<header class="site-header">
  <svg class="header-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M8 18h32l-3 20a3 3 0 0 1-3 2.6H14a3 3 0 0 1-3-2.6L8 18Z"/>
    <path d="M8 18c0-6 7-10 16-10s16 4 16 10"/>
    <path d="M20 30v6M28 30v6"/>
  </svg>
  <h1>Lazzez Chinese Corner</h1>
  <p class="tagline">Wok-fresh flavours, half or full — your call</p>
</header>

<nav class="category-nav" id="categoryNav" aria-label="Menu categories"></nav>

<main id="menuContainer" aria-live="polite"></main>

<section class="rating-section">
  <div class="rating-card">
    <h2>How was your visit?</h2>
    <p>Tap an emoji to send us quick feedback.</p>
    <div class="rating-emojis" id="ratingEmojis" role="group" aria-label="Rate your visit"></div>
    <p class="rating-thanks" id="ratingThanks">Thanks for letting us know! 🙏</p>
  </div>
</section>

<footer>
  <p>Lazzez Chinese Corner</p>
  <p> WHATSAPP_NUMBER="9821793741/8828121314"</p>
  <p>Menu &amp; prices subject to change &middot; <span id="year"></span></p>
</footer>

<script>
  /* =======================================================
     EDIT YOUR MENU HERE
     - Add, remove, or change items freely below.
     - "half" and "full" are prices in rupees (numbers only, no ₹ sign).
     - "note" is optional — delete that whole line if not needed.
     - Keep the commas and curly braces { } exactly as shown.
     ======================================================= */
  const menuData = [
    {
      category: "Rice Dishes",
      icon: "🍚",
      items: [
        { name: "Fried Rice", half: 70, full: 120 },
        { name: "Schezan rice", half: 80, full: 140},
        { name: "Singapore rice", half: 80, full: 140},
        { name: "Combinations rice", half: 80, full: 140},
        { name: "Triple Fried Rice", half: 110, full: 220, note: "Served with egg" }
      ]
    },
    {
      category: "Chinese Specials",
      icon: "⭐",
      items: [
        { name: "Malaysain Chopper rice", half: 130, full: 260 },
         { name: "Garden rice", full: 500 },
         { name: "Arabian Kepsa", full: 1500 },
        { name: "Kepsa rice", full: 1200 },
        { name: "Parda Rice", half: 150, full: 300 },
        { name: "chilly Rice", half: 150, full: 300 },
        { name: "Lazzez Rice", half: 110, full: 220 },
        { name: "KHICHDI Rice", half: 150, full: 300 }
      ]
    },
    {
      category: "Noodles",
      icon: "🍜",
      items: [
        { name: "chicken noodles", half: 70, full: 120 },
        { name: "Schezan noodles", half: 80, full: 140},
        { name: "Singapore noodles", half: 80, full: 140},
        { name: "Combinations noodles", half: 80, full: 140},
        { name: "Triple noodles", half: 110, full: 220, note: "Served with egg" }
      ]
    },
     {
      category: "GRAVY",
      icon: "🍜",
      items: [
        { name: "Chicken Chilly Gravy", half: 110, full: 220 },
        { name: "Chicken Chilly Dry", half: 110, full: 220 },
        { name: "Chicken Crispy Dry", half: 110, full: 220 },
        { name: "Chicken Manchurian Gravy", half: 110, full: 220 },
        { name: "Chicken Manchurian Dry", half: 110, full: 220 },
        { name: "Chicken Schezwan Gravy", half: 110, full: 220 },
        { name: "Chicken Garlic Gravy", half: 110, full: 220 },
        { name: "Chicken Garlic Dry", half: 110, full: 220 },
        { name: "Chicken Ginger Gravy", half: 110, full: 220 },
        { name: "Chicken Ginger Dry", half: 110, full: 220 },
        { name: "Chicken Chow- Chow Gravy", half: 110, full: 220 },
        { name: "Chicken Chow- Chow Dry", half: 110, full: 220 },
        { name: "Chicken 65", half: 120, full: 230 },
        { name: "Chicken Lollipop Masala Dry", half: 120, full: 240 }
      ]
    },
    {
      category: "Soups",
      icon: "🥣",
      items: [
        { name: "Chicken Manchurian Soup", half: 40, full: 80 },
        { name: "Chicken Hot Soup", half: 50, full: 90 },
        { name: "Chicken Royal Soup", half: 50, full: 90 },
        { name: "Chicken Lazeez Soup", half: 50, full: 90 },
        { name: "Chicken Clear Soup", half: 40, full: 80 },
        { name: "Chicken Noodle Soup", half: 50, full: 90 },
        { name: "Chicken Hong Kong Soup", half: 50, full: 90 },
        { name: "Chicken Tomato Soup", half: 60, full: 100 }
        
      ]
    }
  ];

  /* Optional: add your WhatsApp number with country code, no + or spaces
     (e.g. "919876543210"). Leave the quotes empty "" to just show a
     thank-you message instead of opening WhatsApp. */
  const FEEDBACK_WHATSAPP_NUMBER = "";

  // The feedback emojis shown to guests — edit the emoji or label if you like.
  const ratingOptions = [
    { emoji: "😞", label: "Not great" },
    { emoji: "😐", label: "Okay" },
    { emoji: "🙂", label: "Good" },
    { emoji: "😄", label: "Great" },
    { emoji: "🤩", label: "Loved it" }
  ];
  WHATSAPP_NUMBER="9821793741/8828121314"
  
  /* =====================  DO NOT EDIT BELOW THIS LINE  ===================== */

  function renderMenu(data){
    const nav = document.getElementById('categoryNav');
    const main = document.getElementById('menuContainer');
    nav.innerHTML = '';
    main.innerHTML = '';

    data.forEach((cat, i) => {
      const sectionId = 'cat-' + i;

      const navBtn = document.createElement('button');
      navBtn.type = 'button';
      navBtn.textContent = cat.category;
      navBtn.addEventListener('click', () => {
        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      nav.appendChild(navBtn);

      const section = document.createElement('section');
      section.className = 'menu-section';
      section.id = sectionId;

      const h2 = document.createElement('h2');
      if (cat.icon){
        const iconEl = document.createElement('span');
        iconEl.className = 'cat-icon';
        iconEl.setAttribute('aria-hidden', 'true');
        iconEl.textContent = cat.icon;
        h2.appendChild(iconEl);
      }
      const labelEl = document.createElement('span');
      labelEl.textContent = cat.category;
      h2.appendChild(labelEl);
      section.appendChild(h2);

      cat.items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'menu-row';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'name-wrap';
        const nameEl = document.createElement('span');
        nameEl.className = 'name';
        nameEl.textContent = item.name;
        nameWrap.appendChild(nameEl);
        if (item.note){
          const noteEl = document.createElement('span');
          noteEl.className = 'note';
          noteEl.textContent = item.note;
          nameWrap.appendChild(noteEl);
        }

        const leader = document.createElement('span');
        leader.className = 'leader';
        leader.setAttribute('aria-hidden', 'true');

        const prices = document.createElement('div');
        prices.className = 'prices';
        prices.innerHTML =
          '<span class="price">Half ₹' + item.half + '</span>' +
          '<span class="price full">Full ₹' + item.full + '</span>';

        row.appendChild(nameWrap);
        row.appendChild(leader);
        row.appendChild(prices);
        section.appendChild(row);
      });

      main.appendChild(section);
    });
  }

  renderMenu(menuData);
  document.getElementById('year').textContent = new Date().getFullYear();

  // Highlight the active category button while scrolling
  const sections = document.querySelectorAll('.menu-section');
  const navButtons = document.querySelectorAll('.category-nav button');
  if ('IntersectionObserver' in window && sections.length){
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting){
          const idx = Array.from(sections).indexOf(entry.target);
          navButtons.forEach(b => b.classList.remove('active'));
          if (navButtons[idx]) navButtons[idx].classList.add('active');
        }
      });
    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
    sections.forEach(s => observer.observe(s));
  }

  // Emoji feedback widget
  function renderRating(){
    const wrap = document.getElementById('ratingEmojis');
    const thanks = document.getElementById('ratingThanks');
    if (!wrap) return;
    ratingOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = opt.emoji;
      btn.setAttribute('aria-label', opt.label);
      btn.title = opt.label;
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        thanks.classList.add('show');
        if (FEEDBACK_WHATSAPP_NUMBER){
          const msg = encodeURIComponent(
            'Hi Lazzez Chinese Corner! My visit rating: ' + opt.emoji + ' (' + opt.label + ').'
          );
          window.open('https://wa.me/' + FEEDBACK_WHATSAPP_NUMBER + '?text=' + msg, '_blank');
        }
      });
      wrap.appendChild(btn);
    });
  }
  renderRating();
</script>
</body>
</html>
